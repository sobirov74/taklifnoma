<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdulaziz va Muborakxon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #eef4fb;
      --paper: #fffdf8;
      --ink: #10253f;
      --soft: #42658d;
      --gold: #c8a765;
      --line: rgba(66, 101, 141, 0.22);
      --blue: #426fa4;
      --blue-dark: #294f7e;
      --blue-soft: rgba(89, 133, 180, 0.18);
      --aqua: rgba(162, 203, 225, 0.22);
      --mist: rgba(231, 239, 247, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 0% 0%, rgba(112, 155, 202, 0.22), transparent 34%),
        radial-gradient(circle at 100% 100%, rgba(112, 155, 202, 0.18), transparent 38%),
        linear-gradient(180deg, #f8fbff 0%, #edf4fb 100%);
      color: var(--ink);
      font-family: "Cormorant Garamond", serif;
      padding: 26px 12px;
    }

    .phone {
      width: min(100%, 430px);
      margin: 0 auto;
      border-radius: 32px;
      background: var(--paper);
      overflow: hidden;
      position: relative;
      box-shadow: 0 28px 90px rgba(39, 76, 116, 0.22), 0 0 45px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .invite {
      min-height: 100vh;
      padding: 34px 22px 30px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 4% 18%, rgba(128, 174, 214, 0.16), transparent 20%),
        radial-gradient(circle at 98% 18%, rgba(128, 174, 214, 0.18), transparent 22%),
        radial-gradient(circle at 8% 82%, rgba(137, 171, 204, 0.20), transparent 24%),
        radial-gradient(circle at 95% 72%, rgba(197, 218, 235, 0.35), transparent 22%),
        linear-gradient(180deg, #fffef9 0%, #f9fbfd 100%);
    }

    .invite::before,
    .invite::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .invite::before {
      background-image:
        radial-gradient(circle, rgba(200, 167, 101, 0.58) 0 1px, transparent 1.7px),
        radial-gradient(circle, rgba(66, 111, 164, 0.18) 0 2px, transparent 2.8px);
      background-size: 66px 78px, 95px 92px;
      background-position: 10px 28px, 36px 12px;
      opacity: 0.52;
    }

    .invite::after {
      background:
        radial-gradient(ellipse at -6% 10%, rgba(82, 129, 177, 0.28), transparent 23%),
        radial-gradient(ellipse at 110% 31%, rgba(88, 137, 185, 0.22), transparent 25%),
        radial-gradient(ellipse at -5% 88%, rgba(72, 119, 167, 0.20), transparent 24%),
        radial-gradient(ellipse at 112% 92%, rgba(82, 129, 177, 0.20), transparent 24%);
      filter: blur(1px);
    }

    .content {
      position: relative;
      z-index: 2;
    }

    .flower {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 16px 22px rgba(47, 89, 132, 0.08));
    }

    .flower.one {
      width: 215px;
      height: 190px;
      left: -72px;
      top: 36px;
      opacity: 0.78;
    }

    .flower.two {
      width: 210px;
      height: 195px;
      left: -62px;
      bottom: 108px;
      transform: rotate(-12deg);
      opacity: 0.72;
    }

    .bloom {
      position: absolute;
      border-radius: 55% 45% 50% 50%;
      background:
        radial-gradient(circle at 54% 48%, rgba(255,255,255,.72), transparent 30%),
        linear-gradient(135deg, rgba(255,255,255,.92), rgba(139, 174, 211, .32) 55%, rgba(58, 106, 154, .22));
      box-shadow: inset 9px 2px 30px rgba(67, 109, 154, 0.18), 0 10px 25px rgba(73, 116, 160, 0.08);
      transform-origin: center;
    }

    .bloom.a { width: 88px; height: 50px; left: 34px; top: 30px; transform: rotate(-30deg); }
    .bloom.b { width: 92px; height: 52px; left: 78px; top: 42px; transform: rotate(18deg); }
    .bloom.c { width: 88px; height: 54px; left: 56px; top: 73px; transform: rotate(78deg); }
    .bloom.d { width: 74px; height: 50px; left: 22px; top: 68px; transform: rotate(136deg); }

    .flower::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 76px;
      top: 62px;
      border-radius: 50%;
      background: radial-gradient(circle, #c8a765, #f2d68b 54%, rgba(255, 255, 255, 0.3));
    }

    .leaf {
      position: absolute;
      width: 54px;
      height: 20px;
      border-radius: 100% 0 100% 0;
      background: rgba(91, 128, 162, 0.22);
      transform: rotate(-30deg);
    }

    .leaf.l1 { left: 6px; top: 118px; }
    .leaf.l2 { left: 134px; top: 16px; transform: rotate(42deg); background: rgba(86, 124, 160, 0.18); }
    .leaf.l3 { left: 132px; top: 112px; transform: rotate(6deg); background: rgba(100, 144, 184, 0.20); }

    .hero {
      text-align: center;
      padding: 78px 0 18px;
      position: relative;
    }

    .mini-heart {
      color: var(--gold);
      font-size: 18px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .bismillah {
      font-family: "Amiri", serif;
      font-size: 28px;
      line-height: 1.8;
      color: var(--ink);
      direction: rtl;
      margin-bottom: 22px;
      letter-spacing: 0.01em;
    }

    .names {
      font-family: "Playfair Display", serif;
      font-size: clamp(46px, 13vw, 68px);
      line-height: 1.1;
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.025em;
      text-shadow: 0 10px 24px rgba(66, 111, 164, 0.12);
    }

    .and {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 8px auto;
      color: rgba(83, 126, 171, 0.48);
      font-family: "Great Vibes", cursive;
      font-size: 45px;
    }

    .and::before,
    .and::after {
      content: "";
      width: 72px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line));
    }

    .and::after {
      background: linear-gradient(90deg, var(--line), transparent);
    }

    .date {
      margin-top: 12px;
      font-family: "Great Vibes", cursive;
      font-size: 34px;
      color: var(--soft);
    }

    .quran-card {
      width: min(100%, 330px);
      margin: 28px auto 0;
      padding: 18px 18px 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(66, 111, 164, 0.16);
      box-shadow: 0 18px 42px rgba(48, 87, 128, 0.08);
      backdrop-filter: blur(6px);
      text-align: center;
    }

    .quran-card .uzbek {
      font-family: "Playfair Display", serif;
      font-size: 18px;
      line-height: 1.5;
      color: var(--ink);
      font-style: italic;
    }

    .quran-card .source {
      margin-top: 8px;
      font-size: 15px;
      color: #9b7f45;
      letter-spacing: 0.04em;
    }

    .divider {
      width: 150px;
      height: 18px;
      margin: 18px auto 8px;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 9px;
      width: 58px;
      height: 1px;
      background: var(--line);
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .divider span {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      color: var(--gold);
      font-size: 16px;
    }

    .subtitle {
      margin: 22px auto 0;
      max-width: 300px;
      font-family: "Playfair Display", serif;
      font-size: 20px;
      line-height: 1.45;
      color: var(--ink);
      letter-spacing: 0.02em;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      margin: 26px auto 34px;
      max-width: 330px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.74);
      box-shadow: inset 0 0 0 1px rgba(66, 111, 164, 0.10), 0 16px 34px rgba(47, 89, 132, 0.07);
      backdrop-filter: blur(6px);
    }

    .time-box {
      padding: 16px 8px 15px;
      text-align: center;
      position: relative;
    }

    .time-box:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 20%;
      height: 60%;
      width: 1px;
      background: rgba(66, 111, 164, 0.14);
    }

    .time-box strong {
      display: block;
      font-family: "Playfair Display", serif;
      font-size: 34px;
      line-height: 1;
      color: var(--blue-dark);
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .time-box span {
      margin-top: 8px;
      display: block;
      font-size: 18px;
      color: var(--ink);
    }

    .section {
      position: relative;
      border: 1px solid rgba(66, 111, 164, 0.16);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      padding: 26px 18px 24px;
      box-shadow: 0 20px 52px rgba(47, 89, 132, 0.08);
      backdrop-filter: blur(7px);
      overflow: hidden;
      margin-top: 20px;
    }

    .section::before {
      content: "";
      position: absolute;
      right: -30px;
      top: -30px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(139, 177, 211, 0.20), transparent 67%);
    }

    .section-title {
      text-align: center;
      font-family: "Playfair Display", serif;
      font-size: 36px;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 18px;
    }

    .details {
      display: grid;
      gap: 13px;
      text-align: center;
      font-size: 20px;
      color: var(--ink);
      line-height: 1.35;
    }

    .details b {
      font-family: "Playfair Display", serif;
      font-weight: 600;
      color: var(--blue-dark);
    }

    .details + .map-button {
      margin-top: 18px;
    }

    .map-button {
      position: relative;
      overflow: hidden;
      width: min(100%, 260px);
      margin: 0 auto;
      border-radius: 999px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      background: linear-gradient(180deg, #5f87ba, #37679d);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 16px 34px rgba(48, 92, 140, 0.22), 0 0 18px rgba(95, 135, 186, 0.16);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.07em;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .map-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -80%;
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-18deg);
      transition: left 0.65s ease;
    }

    .map-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 42px rgba(48, 92, 140, 0.28), 0 0 24px rgba(95, 135, 186, 0.24);
    }

    .map-button:hover::before {
      left: 125%;
    }

    .map-button svg {
      width: 24px;
      height: 24px;
    }
    .bottom {
      margin: 32px auto 0;
      text-align: center;
      color: var(--gold);
      font-size: 20px;
      opacity: 0.95;
    }

    .cursor-glow {
      position: fixed;
      left: 0;
      top: 0;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle, rgba(121, 166, 214, 0.28) 0%, rgba(121, 166, 214, 0.16) 32%, transparent 68%);
      mix-blend-mode: multiply;
      transition: opacity 0.22s ease;
      will-change: left, top, opacity;
    }

    body.cursor-active .cursor-glow {
      opacity: 1;
    }

    .cursor-sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 51;
      color: #2f78c9;
      font-size: 32px;
      line-height: 1;
      text-shadow:
        0 0 10px rgba(47, 120, 201, 0.65),
        0 0 24px rgba(47, 120, 201, 0.35);
      animation: heartFloat 1.15s ease forwards;
      user-select: none;
      will-change: transform, opacity;
    }

    @keyframes heartFloat {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.55) rotate(0deg);
      }
      35% {
        opacity: 0.95;
        transform: translate(-50%, -92%) scale(1.18) rotate(10deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -185%) scale(0.42) rotate(-18deg);
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .names.reveal.show:hover {
        transform: translateY(-4px) scale(1.018);
        text-shadow: 0 14px 32px rgba(66, 111, 164, 0.20);
      }

      .date.reveal.show:hover,
      .bismillah.reveal.show:hover {
        transform: translateY(-3px) scale(1.025);
      }

      .quran-card.reveal.show:hover,
      .countdown.reveal.show:hover,
      .section.reveal.show:hover {
        transform: translateY(-5px) scale(1.012);
        box-shadow: 0 24px 56px rgba(47, 89, 132, 0.13);
        border-color: rgba(66, 111, 164, 0.25);
      }

      .time-box:hover strong {
        transform: translateY(-2px) scale(1.06);
        color: #1f5c98;
      }

      .time-box strong {
        transition: transform 0.25s ease, color 0.25s ease;
      }
    }

    .reveal {
      opacity: 0;
      transform: translateY(34px) scale(0.98);
      filter: blur(8px);
      transition:
        opacity 0.85s ease,
        transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.85s ease;
      will-change: opacity, transform, filter;
    }

    .reveal.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .fade-left {
      transform: translateX(-34px) scale(0.98);
    }

    .fade-right {
      transform: translateX(34px) scale(0.98);
    }

    .zoom-in {
      transform: translateY(20px) scale(0.92);
    }

    .delay-1 { transition-delay: 0.12s; }
    .delay-2 { transition-delay: 0.22s; }
    .delay-3 { transition-delay: 0.32s; }

    .float-soft {
      animation: floatSoft 5.5s ease-in-out infinite;
    }

    @keyframes floatSoft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal,
      .float-soft {
        animation: none;
        opacity: 1;
        transform: none;
        filter: none;
        transition: none;
      }
    }

    @media (max-width: 390px) {
      body {
        padding: 12px 0;
      }

      .phone {
        border-radius: 0;
        width: 100%;
      }

      .invite {
        padding: 24px 16px 28px;
      }

      .hero {
        padding-top: 72px;
      }

      .names {
        font-size: 45px;
      }

      .countdown {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="cursor-glow" aria-hidden="true"></div>
    <section class="invite">
      <div class="flower one float-soft" aria-hidden="true">
        <span class="bloom a"></span>
        <span class="bloom b"></span>
        <span class="bloom c"></span>
        <span class="bloom d"></span>
        <span class="leaf l1"></span>
        <span class="leaf l2"></span>
        <span class="leaf l3"></span>
      </div>

      <div class="flower two float-soft" aria-hidden="true">
        <span class="bloom a"></span>
        <span class="bloom b"></span>
        <span class="bloom c"></span>
        <span class="bloom d"></span>
        <span class="leaf l1"></span>
        <span class="leaf l2"></span>
        <span class="leaf l3"></span>
      </div>
      <div class="content">
        <section class="hero">
          <div class="mini-heart">♥</div>
          <p class="bismillah reveal zoom-in">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>

          <h1 class="names reveal fade-left delay-1">Abdulaziz</h1>
          <div class="and reveal zoom-in delay-2">&</div>
          <h2 class="names reveal fade-right delay-3">Muborakxon</h2>
          <p class="date reveal zoom-in delay-2">14 iyun, 2026</p>

          <div class="quran-card reveal zoom-in">
            <p class="uzbek">Va sizlarni juft qilib yaratdik</p>
            <p class="source">An-Naba surasi, 78:8</p>
          </div>

          <div class="divider"><span>♥</span></div>
          <p class="subtitle reveal zoom-in">Sizni to‘yimizga taklif qilamiz</p>

          <div class="countdown reveal zoom-in" aria-label="To‘ygacha qolgan vaqt">
            <div class="time-box">
              <strong id="days">00</strong>
              <span>kun</span>
            </div>
            <div class="time-box">
              <strong id="hours">00</strong>
              <span>soat</span>
            </div>
            <div class="time-box">
              <strong id="minutes">00</strong>
              <span>daqiqa</span>
            </div>
          </div>
        </section>

        <section class="section reveal zoom-in">
          <h3 class="section-title">To‘y manzili</h3>
          <div class="details">
            <p><b>Vaqti:</b> 18:00</p>
            <p><b>Manzil:</b> Olmos to‘yxonasi</p>
          </div>

          <a class="map-button" href="https://yandex.uz/maps/-/CPDYyEYb" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18.2 4.5 20.1V6L9 4.1m0 14.1V4.1m0 14.1 6-2.3m0 0 4.5 1.9V3.7L15 1.9m0 14V1.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Xaritani ochish</span>
          </a>
        </section>

        <div class="bottom">♥</div>
      </div>
    </section>
  </main>

  <script>
    const revealItems = document.querySelectorAll(".reveal");

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("show");
          revealObserver.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.16,
      rootMargin: "0px 0px -40px 0px"
    });

    revealItems.forEach((item) => revealObserver.observe(item));

    const cursorGlow = document.querySelector(".cursor-glow");
    let sparkleAllowed = true;

    window.addEventListener("mousemove", (event) => {
      if (!cursorGlow) return;

      document.body.classList.add("cursor-active");
      cursorGlow.style.left = `${event.clientX}px`;
      cursorGlow.style.top = `${event.clientY}px`;

      if (!sparkleAllowed) return;
      sparkleAllowed = false;

      const sparkle = document.createElement("span");
      sparkle.className = "cursor-sparkle";
      sparkle.textContent = "♥";
      sparkle.style.left = `${event.clientX}px`;
      sparkle.style.top = `${event.clientY}px`;
      sparkle.style.fontSize = `${28 + Math.random() * 16}px`;
      sparkle.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 24 - 12}deg)`;
      document.body.appendChild(sparkle);

      setTimeout(() => sparkle.remove(), 1180);
      setTimeout(() => {
        sparkleAllowed = true;
      }, 110);
    });

    window.addEventListener("mouseleave", () => {
      document.body.classList.remove("cursor-active");
    });

    const weddingDate = new Date("2026-06-14T18:00:00+05:00");

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const now = new Date();
      const diff = weddingDate - now;

      if (diff <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        return;
      }

      const totalMinutes = Math.floor(diff / 1000 / 60);
      const days = Math.floor(totalMinutes / 60 / 24);
      const hours = Math.floor((totalMinutes - days * 24 * 60) / 60);
      const minutes = totalMinutes % 60;

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
    }

    updateCountdown();
    setInterval(updateCountdown, 60000);
  </script>
</body>
</html>
